      - name: Install OpenCode and verify free DeepSeek model
        run: |
          set -euo pipefail
          npm install -g opencode-ai@1.19.6
          opencode models opencode | tee models.txt
          grep -Fx opencode/deepseek-v4.1-flash-free models.txt
      - name: Write FILM_SCRIPT with free DeepSeek via OpenCode
        run: |
          cat > brief.txt <<'BRIEF'
          Using the day-one-film-studio skill at ./skills/day-one-film-studio, write a Format A (silent parable) FILM_SCRIPT JSON, 16:9, 30 fps, total runtime 2:30 to 3:15. Topic: "Tomorrow." (procrastination). Hook: "I'll start Monday." He said it every Sunday night. The script must include a matrix_grid scene (5x5 loop of "next monday." promises), a stat_impact ending "52 MONDAYS = 1 YEAR GONE", a Red Shadow whisper after each escalation beat, a shatterAt confrontation, a full-circle mirror ending, and an end_card. Captions 4 to 9 words, character lines 2 to 5 words. Use only the scene types supported by assets/template.html (title_card, stage, matrix_grid, stat_impact, graph_insert, end_card).

          First read skills/day-one-film-studio/SKILL.md, skills/day-one-film-studio/references/script-and-scene-guide.md, and the FILM_SCRIPT structure inside skills/day-one-film-studio/assets/template.html, then follow that exact JSON schema: top-level meta plus a scenes array where every scene has a unique id, label, type, and numeric duration in seconds.

          Output: write ONLY the final script as film_script.json in the current directory (valid JSON, no comments, no markdown fences in the file). Do not render, do not install anything else, do not touch git remotes or credentials, do not publish anywhere. This is creative writing for the repo owner.
          BRIEF
          set -o pipefail
          timeout -k 30 1500 opencode run -m opencode/deepseek-v4.1-flash-free "$(cat brief.txt)" 2>&1 | tee build.log
      - name: Validate film_script.json
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          d = json.load(open('film_script.json', encoding='utf-8'))
          scenes = d.get('scenes')
          assert isinstance(scenes, list) and scenes, 'no scenes array'
          allowed = {'title_card','stage','matrix_grid','stat_impact','graph_insert','end_card'}
          total = 0.0
          for i, s in enumerate(scenes):
              assert isinstance(s.get('duration'), (int, float)) and s['duration'] > 0, f'scene {i} missing duration'
              assert s.get('type') in allowed, f"scene {i} unknown type {s.get('type')}"
              total += float(s['duration'])
          print('scenes:', len(scenes), 'total seconds:', round(total, 1))
          PY
      - name: Commit skill and script to scratch branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b agent/day-one-film-tomorrow
          git add skills/day-one-film-studio film_script.json
          git commit -m 'Day One Films "Tomorrow": pinned skill + DeepSeek-written FILM_SCRIPT (Format A, one-off, no publishing)'
          git push origin agent/day-one-film-tomorrow
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: day-one-film-script
          path: |
            film_script.json
            build.log
            models.txt
          retention-days: 14
