name: tanker-drive-skill-experiment
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: tanker-drive-skill-experiment
  cancel-in-progress: false
jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: tanker-drive-sample
          run-id: 45169629537
          github-token: ${{ github.token }}
          path: saved
      - run: tar -xzf saved/project-source.tar.gz
      - uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            project/node_modules/@huggingface/transformers/.cache
          key: tanker-restore-audio-v1
      - name: Restore original free narration and soundtrack
        working-directory: project
        env:
          ONNXRUNTIME_NODE_INSTALL_CUDA: skip
        run: |
          npm ci
          node scripts/voice.mjs ep2 am_michael 1.05
          node scripts/sound.mjs ep2
          tar --exclude=node_modules --exclude=out --exclude=.git -czf ../retained-scene.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: tanker-retained-scene
          path: retained-scene.tar.gz
          retention-days: 7
  render:
    needs: restore
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: tanker-retained-scene
      - run: mkdir project && tar -xzf retained-scene.tar.gz -C project
      - name: Install cached dependencies
        working-directory: project
        env:
          ONNXRUNTIME_NODE_INSTALL_CUDA: skip
        run: npm ci
      - name: Render retained scene segment
        working-directory: project
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          npx remotion browser ensure
          TOTAL=$(node -e 'const t=require("./episodes/ep2/timing.json");console.log(Math.ceil((t.total+0.7)*30))')
          CHUNK=$(( (TOTAL+3)/4 ))
          START=$((SHARD*CHUNK))
          END=$((START+CHUNK-1))
          if [ "$END" -ge "$TOTAL" ]; then END=$((TOTAL-1)); fi
          npx remotion render src/index.ts Short ../part-${SHARD}.mp4 --frames=${START}-${END} --gl=swangle --concurrency=3 --log=info
      - uses: actions/upload-artifact@v4
        with:
          name: tanker-segment-${{ matrix.shard }}
          path: part-*.mp4
          retention-days: 7
  finish:
    needs: render
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: tanker-segment-*
          merge-multiple: true
          path: parts
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          cd parts
          for n in 0 1 2 3; do printf "file 'part-%s.mp4'\n" "$n"; done > list.txt
          ffmpeg -y -f concat -safe 0 -i list.txt -c copy -movflags +faststart ../tanker-recovered.mp4
          ffprobe -v error -show_streams -show_format ../tanker-recovered.mp4 > ../probe.txt
      - uses: actions/upload-artifact@v4
        with:
          name: tanker-recovered-video
          path: |
            tanker-recovered.mp4
            probe.txt
          retention-days: 14
