name: qwen3-tts-cpu-test
on:
  workflow_dispatch:
jobs:
  cpu-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install qwen-tts soundfile
      - name: Run CPU timing test
        run: python experiments/qwen3-tts-0.6b/cpu_test.py
      - uses: actions/upload-artifact@v4
        with:
          name: qwen3-tts-ryan-cpu
          path: |
            /tmp/qwen3tts_ryan_cpu.wav
            /tmp/qwen_timing.txt
