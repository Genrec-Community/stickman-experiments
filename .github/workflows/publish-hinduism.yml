name: Publish Hinduism pixel sample into the repo
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy the existing Nov 19 pixel Hinduism video out of its run artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dl samples
          gh run download 44565135792 -n hinduism-b7 -D dl
          ls -l dl
          cp dl/video.mp4 samples/pixel-theater-hinduism.mp4
          ffprobe -v error -show_entries stream=width,height,duration -of csv=p=0 samples/pixel-theater-hinduism.mp4 || true
          cat > samples/pixel-theater-hinduism-metadata.json <<'META_EOF'
          {
            "title": "Why Does Hinduism Have No Single Founder?",
            "titles": {
              "option_a_curiosity": "Why Does Hinduism Have No Single Founder?",
              "option_b_contrarian": "A Religion With No Founder?",
              "option_c_search_hybrid": "Hinduism Explained: Dharma, Karma, Moksha"
            },
            "detected_concept": "Hinduism as its followers understand it",
            "primary_niche": "Philosophy",
            "description": "What if one of the world's oldest living religions had no founder at all? This short explains how followers understand Hinduism, from its sacred texts to its festivals.\n\nHinduism has no single founder and no single central authority. It is an ancient, very diverse tradition with more than a billion followers, and its sacred texts include the Vedas, the Upanishads and the Bhagavad Gita. Hindus believe in dharma, the duty and right way of living, karma, the results of our actions, and samsara, the cycle of rebirth. The aim is moksha, liberation from that cycle. Many paths are honored, and people pray at home and in temples and celebrate festivals such as Diwali and Holi.\n\nWhich of these ideas, dharma, karma or moksha, was new to you?",
            "hashtags": [
              "shorts",
              "hinduism",
              "worldreligions",
              "culture",
              "pixelart"
            ]
          }
          META_EOF
          python3 -c "import json;json.load(open('samples/pixel-theater-hinduism-metadata.json'))"
      - name: Commit
        run: |
          git config user.name "github-actions"; git config user.email "actions@users.noreply.github.com"
          git add samples/pixel-theater-hinduism.mp4 samples/pixel-theater-hinduism-metadata.json
          git commit -m "Add pixel Hinduism sample for upload"
          git push
