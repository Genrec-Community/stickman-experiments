name: gpu-deliver
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: gpu-deliver
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: gpu-final-video
          run-id: 45214762860
          github-token: ${{ github.token }}
          path: final
      - name: Verify and publish release
        run: |
          set -euo pipefail
          ls -la final
          test -s final/gpu-manufacturing.mp4
          sha256sum final/gpu-manufacturing.mp4 | tee final/SHA256SUMS
          gh release create gpu-manufacturing-45214762860 final/gpu-manufacturing.mp4 final/probe.txt final/SHA256SUMS --title 'GPU manufacturing sample (run 45214762860)' --notes 'Experimental animated short: how AI GPUs (H100, RTX 5090) are made. Simplified illustrations, not real footage or simulation.' --latest=false
        env:
          GH_TOKEN: ${{ github.token }}
